name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install "PyYAML>=6,<7"
      - name: Validate Skill packages
        run: python scripts/validate_skills.py
      - name: Compile Python scripts
        run: python -m compileall -q skills scripts
      - name: Validate GETO capability foundation
        run: |
          python skills/geto-capability-foundation/scripts/validate_foundation.py
          python skills/geto-capability-foundation/scripts/validate_search_lexicon.py
      - name: Test capability context selection
        run: >-
          python skills/geto-capability-foundation/scripts/select_context.py
          --query "Australia modular housing developer"
          --country AU
          --product-code modular_building
      - name: Validate Company JSON fixtures
        run: |
          python skills/geto-run-market-research/scripts/validate_company_json.py tests/fixtures/freecity-company.json
          python skills/geto-run-market-research/scripts/validate_company_json.py tests/fixtures/electron-company.json
      - name: Run contract unit tests
        run: python -m unittest discover -s tests -v

  credential-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan credentials and private artifacts
        run: python scripts/scan_secrets.py
